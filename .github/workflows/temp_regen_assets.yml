name: Temporary regenerate table assets
on:
  push:
    branches: [main]
    paths:
      - regen_trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui_assets/campaign/islands/billionaire_island
          mkdir -p assets/ui_assets/campaign/islands/coconut_beach
          cat .regen/bill_table_* | base64 -d > assets/ui_assets/campaign/islands/billionaire_island/gameplay_table.png
          cat .regen/bill_shadow_* | base64 -d > assets/ui_assets/campaign/islands/billionaire_island/gameplay_table_shadow.png
          cat .regen/bill_edge_* | base64 -d > assets/ui_assets/campaign/islands/billionaire_island/table_edge_overlay.png
          cat .regen/coco_table_* | base64 -d > assets/ui_assets/campaign/islands/coconut_beach/gameplay_table.png
          cat .regen/coco_shadow_* | base64 -d > assets/ui_assets/campaign/islands/coconut_beach/gameplay_table_shadow.png
          cat .regen/coco_edge_* | base64 -d > assets/ui_assets/campaign/islands/coconut_beach/table_edge_overlay.png
          python - <<'PY'
          from PIL import Image
          paths = [
            "assets/ui_assets/campaign/islands/billionaire_island/gameplay_table.png",
            "assets/ui_assets/campaign/islands/billionaire_island/gameplay_table_shadow.png",
            "assets/ui_assets/campaign/islands/billionaire_island/table_edge_overlay.png",
            "assets/ui_assets/campaign/islands/coconut_beach/gameplay_table.png",
            "assets/ui_assets/campaign/islands/coconut_beach/gameplay_table_shadow.png",
            "assets/ui_assets/campaign/islands/coconut_beach/table_edge_overlay.png",
          ]
          for p in paths:
              im=Image.open(p)
              assert im.size == (720,1280), (p,im.size)
          PY
      - name: Commit replacements and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .regen regen_trigger.txt .github/workflows/temp_regen_assets.yml
          git config user.name "Sekiph82"
          git config user.email "sekiphayit@hotmail.com"
          git add -A
          git commit -m "visual: replace Billionaire and Coconut table assets"
          git push origin HEAD:main
